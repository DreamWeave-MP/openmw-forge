name: OpenMW das-uberbranch (four-hour build)

# Scheduled workflows execute only on the default branch and may be delayed.
on:
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openmw-forge-das-uberbranch
  cancel-in-progress: false

jobs:
  build:
    name: Build and qualify on isolated heavy runner
    runs-on: [self-hosted, Linux, X64, openmw-build]
    timeout-minutes: 330
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-jess
        with:
          version: ${{ vars.JESS_RELEASE_TAG }}
      - name: Validate Jess source before expensive compilation
        run: |
          jess package check .
          jess run --trusted tools/style.jsl
          jess workspace test
          docker info
      - name: Compile Forge ELF
        run: |
          mkdir -p build
          jess run --trusted tools/release.jsl "$PWD/build/openmw-forge-linux-x64"
      - name: Build configured OpenMW, verify tarballs and distro launchers
        env:
          FORGE_BIN: ${{ github.workspace }}/build/openmw-forge-linux-x64
        run: jess run --trusted --package . tools/uberbranch.jsl
      - uses: actions/upload-artifact@v4
        with:
          name: openmw-das-uberbranch-candidate
          path: artifacts/uberbranch/${{ github.run_id }}-${{ github.run_attempt }}/*
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Verify transferred files, publish das-uberbranch
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-jess
        with:
          version: ${{ vars.JESS_RELEASE_TAG }}
      - uses: actions/download-artifact@v4
        with:
          name: openmw-das-uberbranch-candidate
          path: dist
      - name: Verify SHA-256 and provenance; update GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: jess run --trusted --package . tools/uberbranch.jsl --publish-artifacts "$PWD/dist"

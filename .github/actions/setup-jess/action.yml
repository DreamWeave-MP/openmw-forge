name: Install Jess Linux X64
# Jess-specific equivalent of the shared StroggForge setup step. The reusable
# StroggForge rustGlobalBuild workflow requires Cargo and is not valid for JSL.
description: Download a released Jess CLI and add it to PATH
inputs:
  version:
    description: Jess release tag; empty uses latest (pin for reproducible CI)
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Download Jess release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        JESS_TAG: ${{ inputs.version }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/forge-jess"
        if [[ -n "$JESS_TAG" ]]; then
          gh release download "$JESS_TAG" --repo DreamWeave-MP/jess \
            --pattern 'jess-Linux-X64.zip' --dir "$RUNNER_TEMP/forge-jess"
        else
          gh release download --repo DreamWeave-MP/jess \
            --pattern 'jess-Linux-X64.zip' --dir "$RUNNER_TEMP/forge-jess"
        fi
        unzip -oq "$RUNNER_TEMP/forge-jess/jess-Linux-X64.zip" -d "$RUNNER_TEMP/forge-jess"
        chmod +x "$RUNNER_TEMP/forge-jess/jess"
        "$RUNNER_TEMP/forge-jess/jess" --version
        echo "$RUNNER_TEMP/forge-jess" >> "$GITHUB_PATH"

manifest_version = 1

[package]
id = "org.openmw.forge"
version = "0.1.0"
jess_api = "1"
include = ["src", "tools", "tests", "ci"]
tests = ["tests/run.jsl"]
default_target = "forge"

[modules]
"@forge/args" = "src/args.jsl"
"@forge/source" = "src/source.jsl"
"@forge/uberbranch-config" = "ci/uberbranch-config.jsl"
"@forge/uberbranch" = "src/uberbranch.jsl"
"@forge/plan" = "src/plan.jsl"
"@forge/execute" = "src/execute.jsl"
"@forge/config" = "src/config.jsl"
"@forge/native-util" = "src/native_util.jsl"
"@forge/native-assets" = "src/native_assets.jsl"
"@forge/assets" = "src/assets.jsl"
"@forge/native" = "src/native.jsl"
"@forge/native-deps" = "src/native_deps.jsl"
"@forge/native-sdk-cache" = "src/native_sdk_cache.jsl"
"@forge/native-tree-integrity" = "src/native_tree_integrity.jsl"
"@forge/native-openmw" = "src/native_openmw.jsl"
"@forge/native-qt" = "src/native_qt.jsl"
"@forge/native-package" = "src/native_package.jsl"
"@forge/native-release-artifacts" = "src/native_release_artifacts.jsl"
"@forge/native-smoke" = "src/native_smoke.jsl"
"@forge/native-archive" = "src/native_archive.jsl"
"@forge/native-abi" = "src/native_abi.jsl"

[[layer]]
id = "openmw.forge"
exports = ["@forge/uberbranch-config", "@forge/uberbranch", "@forge/source", "@forge/args", "@forge/plan", "@forge/execute", "@forge/config", "@forge/native-util", "@forge/native-assets", "@forge/assets", "@forge/native", "@forge/native-deps", "@forge/native-sdk-cache", "@forge/native-tree-integrity", "@forge/native-openmw", "@forge/native-qt", "@forge/native-package", "@forge/native-release-artifacts", "@forge/native-smoke", "@forge/native-archive", "@forge/native-abi"]

[targets.forge]
kind = "command"
command = "openmw-forge"
entry = "tools/forge.jsl"
capabilities = ["process.environment", "process.spawn", "filesystem.read", "filesystem.write"]
